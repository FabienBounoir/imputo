# Tests (tout push + tag) puis déploiement OpenShift : preprod auto sur push main (avec seed de
# démo), prod auto sur tag. Le stage `test` précède `deploy` : GitLab n'enchaîne un stage que si
# le précédent est vert, donc un tag dont les tests échouent ne déclenche jamais deploy:production.
# Voir openshift/README.md pour le bootstrap requis avant le premier run (namespaces + secrets).
#
# Variables CI/CD à définir (Settings > CI/CD > Variables) :
#   OPENSHIFT_SERVER               URL de l'API du cluster (https://api.xxx:6443)
#   OPENSHIFT_TOKEN_PREPROD        token d'un ServiceAccount avec accès edit sur imputo-preprod
#   OPENSHIFT_TOKEN_PROD           token d'un ServiceAccount avec accès edit sur imputo (namespace
#                                  séparé du token preprod — moindre privilège, chaque SA n'a accès
#                                  qu'à son propre namespace)
#   OPENSHIFT_NAMESPACE_PREPROD    (optionnel, défaut imputo-preprod)
#   OPENSHIFT_NAMESPACE_PROD       (optionnel, défaut imputo)

stages:
  - test
  - deploy

# DB jetable pour les tests d'intégration (vraie DB, pas de mock — voir vitest-setup.ts).
variables:
  POSTGRES_DB: imputo
  POSTGRES_USER: imputo
  POSTGRES_PASSWORD: imputo
  DATABASE_URL: postgres://imputo:imputo@postgres:5432/imputo
  SESSION_SECRET: ci-session-secret
  CRON_SECRET: ci-cron-secret

.test_base:
  stage: test
  services:
    - postgres:16-alpine
  before_script:
    - npm ci
    - node scripts/migrate.js

test:unit:
  extends: .test_base
  image: node:22-alpine
  script:
    - npm test

# fileParallelism est désactivé côté vitest.config (voir vite.config.ts) : certains services
# (cron notifications) parcourent tous les workspaces de la DB sans filtrage, donc des fichiers de
# test en parallèle qui créent/suppriment des workspaces se marchent dessus. La suite tourne donc
# séquentiellement, ~1min.
test:e2e:
  extends: .test_base
  image: cypress/included:15.20.0
  script:
    - npm run dev &
    - node -e "const t=Date.now();(async()=>{while(Date.now()-t<60000){try{if((await fetch('http://localhost:5173/login')).ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)})()"
    - npx cypress run

.oc_base:
  image: quay.io/openshift/origin-cli:latest
  before_script:
    - oc login --token="$OPENSHIFT_TOKEN" --server="$OPENSHIFT_SERVER"

# Manifestes communs aux deux environnements — jamais secret.yaml / db-secret.yaml (vraies
# valeurs uniquement sur le cluster, voir openshift/README.md).
.apply_base_manifests: &apply_base_manifests
  - oc apply -f openshift/imagestream.yaml -f openshift/buildconfig.yaml -f openshift/configmap.yaml
    -f openshift/deployment.yaml -f openshift/service.yaml -f openshift/route.yaml
    -f openshift/db-statefulset.yaml -f openshift/cronjobs.yaml

deploy:preprod:
  extends: .oc_base
  stage: deploy
  rules:
    # main : déploiement auto comme avant. Toute autre branche : job optionnel (bouton manuel dans
    # l'UI GitLab), ne bloque jamais le pipeline (allow_failure) — permet de pousser une branche en
    # preprod pour la tester sans devoir merger sur main.
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: manual
      allow_failure: true
  variables:
    OPENSHIFT_TOKEN: $OPENSHIFT_TOKEN_PREPROD
  script:
    - NS="${OPENSHIFT_NAMESPACE_PREPROD:-imputo-preprod}"
    - oc project "$NS"
    - *apply_base_manifests
    - oc apply -f openshift/buildconfig-tools.yaml
    # Route hébergée sur un host auto-généré différent du prod : on corrige le ConfigMap avant
    # le rollout pour que l'app démarre avec la bonne BASE_URL/ORIGIN (sinon "Cross-site
    # POST form submissions are forbidden", voir openshift/README.md).
    - HOST=$(oc get route imputo -o jsonpath='{.spec.host}')
    - oc patch configmap imputo-config --type merge -p "{\"data\":{\"BASE_URL\":\"https://${HOST}\",\"ORIGIN\":\"https://${HOST}\"}}"
    - oc start-build imputo --build-arg=APP_VERSION="v$CI_COMMIT_SHORT_SHA" --follow
    - oc rollout status deployment/imputo --timeout=5m
    - oc start-build imputo-tools --follow
    - oc delete job/imputo-seed --ignore-not-found
    - sed "s#CHANGEME-namespace#${NS}#" openshift/seed-job.yaml | oc apply -f -
    - oc wait --for=condition=complete job/imputo-seed --timeout=320s

deploy:production:
  extends: .oc_base
  stage: deploy
  rules:
    - if: '$CI_COMMIT_TAG'
  variables:
    OPENSHIFT_TOKEN: $OPENSHIFT_TOKEN_PROD
  script:
    - NS="${OPENSHIFT_NAMESPACE_PROD:-imputo}"
    - oc project "$NS"
    - *apply_base_manifests
    - oc start-build imputo --commit="$CI_COMMIT_TAG" --build-arg=APP_VERSION="$CI_COMMIT_TAG" --follow
    - oc rollout status deployment/imputo --timeout=5m

# Tests (tout push + tag) puis déploiement OpenShift : preprod auto sur push main (avec seed de
# démo), prod auto sur tag. Le stage `test` précède `deploy` : GitLab n'enchaîne un stage que si
# le précédent est vert, donc un tag dont les tests échouent ne déclenche jamais deploy:production.
# Voir openshift/README.md pour le bootstrap requis avant le premier run (namespaces + secrets).
#
# Variables CI/CD à définir (Settings > CI/CD > Variables) :
#   OPENSHIFT_SERVER               URL de l'API du cluster (https://api.xxx:6443)
#   OPENSHIFT_TOKEN_PREPROD        token d'un ServiceAccount avec accès edit sur imputo-preprod
#   OPENSHIFT_TOKEN_PROD           token d'un ServiceAccount avec accès edit sur imputo (namespace
#                                  séparé du token preprod — moindre privilège, chaque SA n'a accès
#                                  qu'à son propre namespace)
#   OPENSHIFT_NAMESPACE_PREPROD    (optionnel, défaut imputo-preprod)
#   OPENSHIFT_NAMESPACE_PROD       (optionnel, défaut imputo)
#   OPENSHIFT_TOKEN_LOGS           token d'un ServiceAccount avec accès edit sur imputo-logs
#                                  (Loki + Grafana, namespace séparé — voir openshift/logging/)
#   OPENSHIFT_NAMESPACE_LOGS       (optionnel, défaut imputo-logs)
#   GRAFANA_ANNOTATIONS_TOKEN      token d'un Service Account Grafana (rôle Editor suffit — voir
#                                  openshift/logging/README.md) : pose une annotation de déploiement
#                                  sur tous les graphes à chaque `deploy:preprod`/`deploy:production`
#                                  réussi. Optionnel — si absent, le déploiement se termine quand
#                                  même normalement, juste sans l'annotation (`|| true`).
#
# Audit de sécurité récurrent (job `audit`, tourne aussi à chaque push) : pour qu'il tourne même
# sans nouveau commit et attraper une faille publiée après coup sur une lib déjà en place —
# CI/CD > Schedules > New schedule, cible la branche `main`, cron hebdomadaire par ex. `0 6 * * 1`
# (lundi 6h). Aucune variable supplémentaire à fournir, le job tourne à l'identique.

stages:
  - test
  - deploy
  - demo-data

# DB jetable pour les tests d'intégration (vraie DB, pas de mock — voir vitest-setup.ts).
variables:
  POSTGRES_DB: imputo
  POSTGRES_USER: imputo
  POSTGRES_PASSWORD: imputo
  DATABASE_URL: postgres://imputo:imputo@postgres:5432/imputo
  SESSION_SECRET: ci-session-secret
  CRON_SECRET: ci-cron-secret

# node_modules mis en cache par le hash du lockfile — chaque job de ce fichier fait son propre
# `npm ci`, ce cache évite de retélécharger tout le registre npm à chaque run.
.npm_cache: &npm_cache
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
  policy: pull-push

.test_base:
  stage: test
  services:
    - postgres:16-alpine
  cache:
    <<: *npm_cache
  before_script:
    - npm ci --cache .npm --prefer-offline
    - node scripts/migrate.js

test:unit:
  extends: .test_base
  image: node:22-alpine
  script:
    - npm test

# fileParallelism est désactivé côté vitest.config (voir vite.config.ts) : certains services
# (cron notifications) parcourent tous les workspaces de la DB sans filtrage, donc des fichiers de
# test en parallèle qui créent/suppriment des workspaces se marchent dessus. La suite tourne donc
# séquentiellement, ~1min.
test:e2e:
  extends: .test_base
  image: cypress/included:15.20.0
  script:
    - npm run dev &
    - node -e "const t=Date.now();(async()=>{while(Date.now()-t<60000){try{if((await fetch('http://localhost:5173/login')).ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)})()"
    - npx cypress run

# Ni l'un ni l'autre n'était vérifié en CI jusqu'ici — une erreur de type ou un build cassé ne se
# découvrait qu'en local (ou pire, pendant le déploiement OpenShift lui-même pour le build).
check:types:
  stage: test
  image: node:22-alpine
  cache:
    <<: *npm_cache
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run check

check:build:
  stage: test
  image: node:22-alpine
  cache:
    <<: *npm_cache
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build

# `--audit-level=high` : échoue le job (pipeline rouge, visible) sur une faille haute/critique
# nouvellement introduite ou publiée depuis le dernier run — pas sur les modérées/basses, trop de
# bruit pour ce niveau de criticité. Tourne à chaque push (attrape une dépendance vulnérable
# ajoutée dans une MR) et sur schedule (attrape une faille publiée après coup sur une lib déjà en
# place — voir README.md pour configurer le Pipeline Schedule côté GitLab, pas faisable depuis ce
# fichier seul).
audit:
  stage: test
  image: node:22-alpine
  allow_failure: true
  cache:
    <<: *npm_cache
  script:
    - npm ci --cache .npm --prefer-offline
    - npm audit --audit-level=high

.oc_base:
  image: quay.io/openshift/origin-cli:latest
  before_script:
    - oc login --token="$OPENSHIFT_TOKEN" --server="$OPENSHIFT_SERVER"

# Manifestes communs aux deux environnements — jamais secret.yaml / db-secret.yaml (vraies
# valeurs uniquement sur le cluster, voir openshift/README.md).
.apply_base_manifests: &apply_base_manifests
  - oc apply -f openshift/imagestream.yaml -f openshift/buildconfig.yaml -f openshift/configmap.yaml
    -f openshift/deployment.yaml -f openshift/service.yaml -f openshift/route.yaml
    -f openshift/db-statefulset.yaml -f openshift/cronjobs.yaml

deploy:preprod:
  extends: .oc_base
  stage: deploy
  rules:
    # main : déploiement auto comme avant. Toute autre branche : job optionnel (bouton manuel dans
    # l'UI GitLab), ne bloque jamais le pipeline (allow_failure) — permet de pousser une branche en
    # preprod pour la tester sans devoir merger sur main.
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: manual
      allow_failure: true
  variables:
    OPENSHIFT_TOKEN: $OPENSHIFT_TOKEN_PREPROD
  script:
    - NS="${OPENSHIFT_NAMESPACE_PREPROD:-imputo-preprod}"
    - oc project "$NS"
    - *apply_base_manifests
    - oc apply -f openshift/buildconfig-tools.yaml
    # Route hébergée sur un host auto-généré différent du prod : on corrige le ConfigMap avant
    # le rollout pour que l'app démarre avec la bonne BASE_URL/ORIGIN (sinon "Cross-site
    # POST form submissions are forbidden", voir openshift/README.md).
    - HOST=$(oc get route imputo -o jsonpath='{.spec.host}')
    - oc patch configmap imputo-config --type merge -p "{\"data\":{\"BASE_URL\":\"https://${HOST}\",\"ORIGIN\":\"https://${HOST}\"}}"
    - oc start-build imputo --build-arg=APP_VERSION="v$CI_COMMIT_SHORT_SHA" --follow
    - oc rollout status deployment/imputo --timeout=5m
    # Ligne verticale sur tous les graphes Grafana au moment du déploiement — corrèle un pic
    # d'erreur avec "un déploiement vient-il de se produire ?" sans avoir à croiser les dates à la
    # main. `|| true` : optionnel, ne doit jamais faire échouer un déploiement par ailleurs réussi.
    - |
      if [ -n "$GRAFANA_ANNOTATIONS_TOKEN" ]; then
        curl -s -o /dev/null -H "Authorization: Bearer $GRAFANA_ANNOTATIONS_TOKEN" -H "Content-Type: application/json" \
          -X POST "https://grafana-imputo-logs.apps.ocp4.innershift.sodigital.io/api/annotations" \
          -d "{\"text\":\"Deploiement preprod v$CI_COMMIT_SHORT_SHA\",\"tags\":[\"deploy\",\"env:${NS}\"],\"time\":$(($(date +%s%N)/1000000))}" || true
      fi
    # `rollout status` ne garantit que le scale-down de l'ancien ReplicaSet, pas la disparition
    # effective du pod (un pod Terminating compte encore dans le quota CPU du namespace, capé à
    # 4 cores sur imputo-preprod). Sans cette pause, le build imputo-tools puis le Job imputo-seed
    # qui suivent immédiatement se font régulièrement rejeter par l'admission (quota exceeded),
    # et imputo-seed reste bloqué à 0 pod jusqu'au timeout du `oc wait` plus bas.
    - |
      echo "Attente de la libération du quota CPU (ancien pod du rollout encore en Terminating)..."
      for i in $(seq 1 30); do
        oc get pods -l app=imputo --no-headers | grep -q Terminating || break
        sleep 2
      done
    - oc start-build imputo-tools --follow
    - sed "s#CHANGEME-namespace#${NS}#" openshift/cronjob-jira-sync.yaml | oc apply -f -

# Manuel, jamais automatique : Loki + Grafana (namespace imputo-logs, séparé, quota indépendant —
# voir openshift/logging/README.md) ne suivent pas le cycle release d'imputo lui-même, pas besoin
# de les redéployer à chaque push main. Ni build ni ImageStream ici — Loki/Grafana utilisent des
# images publiques (docker.io/grafana/*), `oc apply` suffit. `grafana-secret.yaml` est
# volontairement absent de la liste : c'est un template avec un placeholder CHANGEME, l'appliquer
# écraserait le vrai secret admin déjà en place sur le cluster (voir le fichier lui-même).
deploy:logging:
  extends: .oc_base
  stage: deploy
  rules:
    - when: manual
      allow_failure: true
  variables:
    OPENSHIFT_TOKEN: $OPENSHIFT_TOKEN_LOGS
  script:
    - NS="${OPENSHIFT_NAMESPACE_LOGS:-imputo-logs}"
    - oc project "$NS"
    - oc apply -f openshift/logging/configmap.yaml -f openshift/logging/pvc.yaml
        -f openshift/logging/service.yaml -f openshift/logging/networkpolicy.yaml
        -f openshift/logging/deployment.yaml
    - oc rollout status deployment/loki --timeout=3m
    - oc apply -f openshift/logging/grafana-provisioning-configmap.yaml
        -f openshift/logging/grafana-dashboard-preprod-configmap.yaml
        -f openshift/logging/grafana-dashboard-prod-configmap.yaml -f openshift/logging/grafana-pvc.yaml
        -f openshift/logging/grafana-service.yaml -f openshift/logging/grafana-deployment.yaml
        -f openshift/logging/grafana-route.yaml
    # Redémarre Grafana pour reprendre en compte tout de suite les ConfigMaps (dashboards,
    # datasource) — sinon dépend de la resync périodique de kubelet, pas immédiate.
    - oc rollout restart deployment/grafana
    - oc rollout status deployment/grafana --timeout=3m

# Entièrement manuels (pas de `needs`/auto sur main) : même avec le wait-loop plus haut, la fenêtre
# juste après un rollout reste peu fiable — le quota CPU (4 cores sur imputo-preprod) peut être
# transitoirement "doublé" (ancien pod encore Terminating + nouveau pas encore Ready comptent tous
# les deux), et un pod de build fraîchement terminé n'a jamais le label `app=imputo` que ce
# wait-loop surveille. Plutôt que de viser une fenêtre de tir fiable en CI, on déclenche à la main
# une fois le rollout visiblement stabilisé — données de démo, jamais bloquant pour un vrai déploiement.
seed:preprod:
  extends: .oc_base
  stage: demo-data
  rules:
    - when: manual
      allow_failure: true
  variables:
    OPENSHIFT_TOKEN: $OPENSHIFT_TOKEN_PREPROD
  script:
    - NS="${OPENSHIFT_NAMESPACE_PREPROD:-imputo-preprod}"
    - oc project "$NS"
    - oc delete job/imputo-seed --ignore-not-found
    - sed "s#CHANGEME-namespace#${NS}#" openshift/seed-job.yaml | oc apply -f -
    - oc wait --for=condition=complete job/imputo-seed --timeout=320s

# Symétrique de seed:preprod — vide les données de démo (voir src/lib/server/db/unseed.ts).
unseed:preprod:
  extends: .oc_base
  stage: demo-data
  rules:
    - when: manual
      allow_failure: true
  variables:
    OPENSHIFT_TOKEN: $OPENSHIFT_TOKEN_PREPROD
  script:
    - NS="${OPENSHIFT_NAMESPACE_PREPROD:-imputo-preprod}"
    - oc project "$NS"
    - oc delete job/imputo-unseed --ignore-not-found
    - sed "s#CHANGEME-namespace#${NS}#" openshift/unseed-job.yaml | oc apply -f -
    - oc wait --for=condition=complete job/imputo-unseed --timeout=320s

deploy:production:
  extends: .oc_base
  stage: deploy
  rules:
    - if: '$CI_COMMIT_TAG'
  variables:
    OPENSHIFT_TOKEN: $OPENSHIFT_TOKEN_PROD
  script:
    - NS="${OPENSHIFT_NAMESPACE_PROD:-imputo}"
    - oc project "$NS"
    - *apply_base_manifests
    - oc start-build imputo --commit="$CI_COMMIT_TAG" --build-arg=APP_VERSION="$CI_COMMIT_TAG" --follow
    - oc rollout status deployment/imputo --timeout=5m
    - |
      if [ -n "$GRAFANA_ANNOTATIONS_TOKEN" ]; then
        curl -s -o /dev/null -H "Authorization: Bearer $GRAFANA_ANNOTATIONS_TOKEN" -H "Content-Type: application/json" \
          -X POST "https://grafana-imputo-logs.apps.ocp4.innershift.sodigital.io/api/annotations" \
          -d "{\"text\":\"Deploiement production $CI_COMMIT_TAG\",\"tags\":[\"deploy\",\"env:${NS}\"],\"time\":$(($(date +%s%N)/1000000))}" || true
      fi
    # imputo:tools n'existait jusqu'ici qu'en preprod (seed de démo) — nécessaire ici pour le
    # CronJob de sync Jira récurrent, qui tourne isolé du pod web (voir cronjob-jira-sync.yaml).
    # Pas d'imputo-seed en prod : ça reste strictement un outil de démo preprod.
    - oc apply -f openshift/buildconfig-tools.yaml
    - oc start-build imputo-tools --follow
    - sed "s#CHANGEME-namespace#${NS}#" openshift/cronjob-jira-sync.yaml | oc apply -f -

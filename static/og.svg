<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
	<defs>
		<linearGradient id="ogTile" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#22c55e" />
			<stop offset="1" stop-color="#15803d" />
		</linearGradient>
		<radialGradient id="ogBg" cx="85%" cy="-10%" r="90%">
			<stop offset="0" stop-color="#dcf3e3" />
			<stop offset="60%" stop-color="#f4f2ec" />
			<stop offset="100%" stop-color="#f4f2ec" />
		</radialGradient>
	</defs>
	<rect width="1200" height="630" fill="url(#ogBg)" />

	<!-- Logo -->
	<g transform="translate(150 205)">
		<rect width="220" height="220" rx="52" fill="url(#ogTile)" />
		<g fill="#ffffff" transform="scale(0.4297)">
			<rect x="132" y="284" width="64" height="96" rx="30" />
			<rect x="224" y="230" width="64" height="150" rx="30" />
			<rect x="316" y="170" width="64" height="210" rx="30" />
			<circle cx="348" cy="116" r="32" />
		</g>
	</g>

	<!-- Wordmark -->
	<text x="430" y="305" font-family="Georgia, 'Times New Roman', serif" font-size="118" font-weight="700" fill="#1b1d24">Imputo</text>
	<text x="434" y="372" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" fill="#5b6472">Suivi de chiffrage &amp; d'imputation</text>
</svg>

# Template de secret applicatif — NE JAMAIS committer de vraies valeurs ici.
# Avant le premier déploiement, remplacer les placeholders, par exemple :
#   oc create secret generic imputo-secrets \
#     --from-literal=DATABASE_URL='postgres://<user>:<password>@imputo-db:5432/<db>' \
#     --from-literal=SESSION_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=CRON_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=VAPID_PUBLIC_KEY='...' \
#     --from-literal=VAPID_PRIVATE_KEY='...' \
#     --from-literal=AZURE_CLIENT_SECRET='...' \
#     --from-literal=JIRA_PAT_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
#     --dry-run=client -o yaml | oc apply -f -
# (les clés VAPID peuvent être générées avec `npx web-push generate-vapid-keys`)
# JIRA_PAT_ENCRYPTION_KEY chiffre les PAT Jira saisis par espace (admin > Intégration Jira) —
# distincte de SESSION_SECRET ; toute rotation rend les PAT déjà enregistrés indéchiffrables.
apiVersion: v1
kind: Secret
metadata:
  name: imputo-secrets
  labels:
    app: imputo
type: Opaque
stringData:
  DATABASE_URL: 'postgres://CHANGEME:CHANGEME@imputo-db:5432/imputo'
  SESSION_SECRET: 'CHANGEME-generate-a-random-secret'
  CRON_SECRET: 'CHANGEME-generate-a-random-secret'
  VAPID_PUBLIC_KEY: ''
  VAPID_PRIVATE_KEY: ''
  AZURE_CLIENT_SECRET: 'CHANGEME-generate-a-random-secret'
  JIRA_PAT_ENCRYPTION_KEY: 'CHANGEME-generate-a-random-secret'

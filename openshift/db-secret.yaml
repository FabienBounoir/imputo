# Séparé de db-statefulset.yaml pour que la CI puisse appliquer le reste de ce fichier à
# chaque déploiement sans jamais re-committer/écraser le vrai mot de passe (même traitement
# que secret.yaml — ne jamais appliquer ce fichier une fois rempli avec de vraies valeurs,
# préférer `oc create secret` / `oc edit secret` directement sur le cluster).
apiVersion: v1
kind: Secret
metadata:
  name: imputo-db-secret
  labels:
    app: imputo-db
type: Opaque
stringData:
  # Remplacer avant déploiement — doit correspondre à la valeur DATABASE_URL du secret
  # imputo-secrets (postgres://<user>:<password>@imputo-db:5432/<db>).
  POSTGRESQL_USER: imputo
  POSTGRESQL_PASSWORD: 'CHANGEME-generate-a-random-password'
  POSTGRESQL_DATABASE: imputo

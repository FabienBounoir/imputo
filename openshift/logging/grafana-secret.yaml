# Template — NE JAMAIS committer de vraie valeur ici, même pattern que secret.yaml (imputo).
# Avant déploiement :
#   oc create secret generic grafana-admin \
#     --from-literal=GF_SECURITY_ADMIN_USER=admin \
#     --from-literal=GF_SECURITY_ADMIN_PASSWORD="$(openssl rand -base64 24)" \
#     --dry-run=client -o yaml | oc apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  labels:
    app: grafana
type: Opaque
stringData:
  GF_SECURITY_ADMIN_USER: 'admin'
  GF_SECURITY_ADMIN_PASSWORD: 'CHANGEME-generate-a-random-secret'

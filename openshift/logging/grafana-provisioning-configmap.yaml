# Provisioning déclaratif (datasource + dashboard) plutôt que du clic dans l'UI : reproductible,
# survit à un redéploiement de Grafana même sans le PVC (voir grafana-dashboard-{preprod,prod}-
# configmap.yaml pour le contenu des dashboards). Deux dossiers séparés (pas un seul avec variable
# $env) pour qu'il soit impossible d'ouvrir le mauvais environnement par erreur.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  labels:
    app: grafana
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki.imputo-logs.svc.cluster.local:3100
        isDefault: true
        jsonData:
          maxLines: 1000
          # Défaut 30s trop court pour un distinct-count sur un champ JSON non indexé (ex.
          # utilisateurs actifs/jour) — doit parser tout le volume de la fenêtre.
          timeout: 60
      # Requêtes HTTP génériques (pas de "url" ici : fournie par chaque requête) — sert au check
      # santé externe sur la vraie Route publique (voir /api/health, README.md).
      - name: Infinity
        type: yesoreyeram-infinity-datasource
        uid: infinity
        isDefault: false
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: imputo-preprod
        folder: Imputo - Preprod
        type: file
        options:
          path: /etc/grafana/dashboards/preprod
      - name: imputo-prod
        folder: Imputo - Prod
        type: file
        options:
          path: /etc/grafana/dashboards/prod

apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:12.4.9
          ports:
            - containerPort: 3000
              protocol: TCP
              name: http
          envFrom:
            - secretRef:
                name: grafana-admin
          env:
            # OpenShift assigne un UID arbitraire (restricted SCC) : Grafana ne doit pas dépendre
            # de son UID/GID baké dans l'image pour ses chemins de données/plugins.
            - name: GF_PATHS_DATA
              value: /var/lib/grafana
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
            # Pas d'auto-inscription/anonyme : accès admin uniquement (voir grafana-secret.yaml).
            - name: GF_USERS_ALLOW_SIGN_UP
              value: 'false'
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: 'false'
            # Plugin communautaire "Infinity" : seule façon pour Grafana de taper une URL HTTP et
            # d'alerter sur son code retour, nativement il ne sait faire ça qu'à travers Loki.
            # Sert au check santé externe (voir /api/health côté appli et README.md).
            - name: GF_INSTALL_PLUGINS
              value: yesoreyeram-infinity-datasource
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasource.yaml
              subPath: datasource.yaml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: dashboard-preprod
              mountPath: /etc/grafana/dashboards/preprod
            - name: dashboard-prod
              mountPath: /etc/grafana/dashboards/prod
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: provisioning
          configMap:
            name: grafana-provisioning
        - name: dashboard-preprod
          configMap:
            name: grafana-dashboard-imputo-preprod
        - name: dashboard-prod
          configMap:
            name: grafana-dashboard-imputo-prod

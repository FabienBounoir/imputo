          },
          "gridPos": {
            "h": 12,
            "w": 24,
            "x": 0,
            "y": 10
          },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "{app=\"imputo\", env=\"imputo-preprod\", level=\"error\"}"
            }
          ]
        }
      ]
    }
  05-securite.json: |
    {
      "title": "Imputo — Sécurité (Preprod)",
      "uid": "imputo-security-preprod",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Tentatives cron non autorisées",
          "type": "timeseries",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum by (job) (count_over_time({app=\"imputo\", env=\"imputo-preprod\"} | json | msg=\"cron_unauthorized\" [$__interval]))",

            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum by (msg) (count_over_time({app=\"imputo\", env=\"imputo-preprod\", level=\"error\"} | json [$__interval]))",
              "legendFormat": "{{msg}}"

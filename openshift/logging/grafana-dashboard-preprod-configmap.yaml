  03-jira-sync.json: |
    {
      "title": "Imputo — Sync Jira (Preprod)",
      "uid": "imputo-jira-preprod",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,

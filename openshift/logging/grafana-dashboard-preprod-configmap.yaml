        {
          "id": 2,
          "title": "Abonnements push rejetés (endpoint hors liste blanche)",
          "type": "timeseries",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",

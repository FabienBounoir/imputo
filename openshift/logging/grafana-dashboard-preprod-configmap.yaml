          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum(count_over_time({app=\"imputo\", env=\"imputo-preprod\"} | json | msg=\"jira_sync_failed\" | authFailure=\"true\" [$__interval]))",
              "legendFormat": "échecs PAT"
            }
          ]
        },
        {
          "id": 4,
          "title": "Logs bruts — événements sécurité",
          "type": "logs",
          "datasource": {

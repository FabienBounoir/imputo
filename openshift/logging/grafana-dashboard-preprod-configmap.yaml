            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum by (job) (count_over_time({app=\"imputo\", env=\"imputo-preprod\"} | json | msg=\"cron_unauthorized\" [$__interval]))",
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "id": 5,
          "title": "Logs bruts — jobs",
          "type": "logs",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 16

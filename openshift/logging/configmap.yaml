# Loki single-binary (mode "monolithic") : stockage filesystem local (PVC), pas de S3/GCS à
# opérer. Suffisant pour le volume d'un seul petit projet interne — pas un besoin d'échelle.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  labels:
    app: loki
data:
  loki-config.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      # 30 jours, cohérent avec ARCHIVE_RETENTION de l'app (config.ts) — même logique de rétention
      # que le reste du système, pas une valeur choisie au hasard.
      retention_period: 720h
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      ingestion_rate_mb: 8
      ingestion_burst_size_mb: 16
      # Défaut Loki (500) trop bas pour un "count by (userId)" sur un espace avec beaucoup de
      # comptes — atteint en pratique avec les personas de test de charge sur preprod.
      max_query_series: 5000

    compactor:
      working_directory: /loki/compactor
      retention_enabled: true

# Team mood : dernier jour de la plage, relance ceux qui n'ont pas encore voté. Pas de slot :
# un seul appel/jour, la condition (period.end === today) ne matche qu'un jour par plage.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: imputo-cron-notify-mood-deadline
  labels:
    app: imputo
spec:
  timeZone: Europe/Paris
  schedule: '0 10 * * *'
  jobTemplate:
    spec:
      activeDeadlineSeconds: 60
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: curl
              image: curlimages/curl:latest
              args:
                - -fsS
                - --max-time
                - '30'
                - -X
                - POST
                - -H
                - 'Authorization: Bearer $(CRON_SECRET)'
                - 'http://imputo:3000/api/jobs/notify?kind=mood-deadline'
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: imputo-secrets
                      key: CRON_SECRET

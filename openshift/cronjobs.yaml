# Jobs planifiés décrits dans README.md (§ Déploiement portable) — appelés ici via le Service
# ClusterIP interne "imputo" (pas la Route publique), authentifiés par CRON_SECRET.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: imputo-cron-cleanup
  labels:
    app: imputo
spec:
  schedule: '0 3 * * *'
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: curl
              image: curlimages/curl:latest
              args:
                - -fsS
                - -X
                - POST
                - -H
                - Authorization: Bearer $(CRON_SECRET)
                - http://imputo:3000/api/jobs/cleanup
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: imputo-secrets
                      key: CRON_SECRET
---

# Template — ne JAMAIS committer les vraies valeurs.
# Créer sur le cluster avec :
#   oc create secret generic imputo-mcp-secrets \
#     --from-literal=MCP_TOKEN=<token-mcp-genere-depuis-admin> \
#     --from-literal=MCP_BEARER_TOKEN=<secret-aleatoire-pour-les-clients-claude> \
#     --from-literal=IMPUTO_URL=http://imputo.<namespace>.svc.cluster.local:3000
#
# MCP_TOKEN      : token généré depuis /admin/mcp-tokens dans imputo (lié à un compte admin)
# MCP_BEARER_TOKEN : secret que les clients Claude Code mettent dans leur Authorization: Bearer
# IMPUTO_URL     : URL interne du cluster (pas la route publique)
apiVersion: v1
kind: Secret
metadata:
  name: imputo-mcp-secrets
type: Opaque
stringData:
  MCP_TOKEN: CHANGEME
  MCP_BEARER_TOKEN: CHANGEME
  IMPUTO_URL: CHANGEME

<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
		<meta name="text-scale" content="scale" />

		<!-- Polices : <link> plutôt que @import dans app.css — le navigateur les découvre dès le
		     parsing du HTML au lieu d'attendre le CSS, donc moins de flash de police par défaut. -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
		/>

		<!-- Identité / favicon -->
		<!-- L'icône SVG est déclarée par le layout racine (svelte:head), pas ici : son href change
		     avec la couleur d'accent pour forcer le navigateur à la re-fetcher (voir +layout.svelte). -->
		<link rel="alternate icon" type="image/png" href="/icons/favicon-32.png" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

		<!-- PWA -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<!-- Écrans de démarrage iOS : Android/Chrome les génère seul depuis le manifest, mais iOS n'a
		     pas d'équivalent — une image par (résolution exacte d'appareil, thème). Générées par
		     scripts/gen-icons.sh, portrait iPhone uniquement (voir le commentaire du script). -->
		<link rel="apple-touch-startup-image" href="/icons/splash/apple-splash-320-568-2.png" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait) and (prefers-color-scheme: light)" />
		<link rel="apple-touch-startup-image" href="/icons/splash/apple-splash-320-568-2-dark.png" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait) and (prefers-color-scheme: dark)" />
		<link rel="apple-touch-startup-image" href="/icons/splash/apple-splash-375-667-2.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait) and (prefers-color-scheme: light)" />
		<link rel="apple-touch-startup-image" href="/icons/splash/apple-splash-375-667-2-dark.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait) and (prefers-color-scheme: dark)" />
		<link rel="apple-touch-startup-image" href="/icons/splash/apple-splash-375-812-3.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" />
		<link rel="apple-touch-startup-image" href="/icons/splash/apple-splash-375-812-3-dark.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" />
		<link rel="apple-touch-startup-image" href="/icons/splash/apple-splash-390-844-3.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" />
		<link rel="apple-touch-startup-image" href="/icons/splash/apple-splash-390-844-3-dark.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" />
		<link rel="apple-touch-startup-image" href="/icons/splash/apple-splash-393-852-3.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" />
		<link rel="apple-touch-startup-image" href="/icons/splash/apple-splash-393-852-3-dark.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" />
		<link rel="apple-touch-startup-image" href="/icons/splash/apple-splash-414-736-3.png" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" />
		<link rel="apple-touch-startup-image" href="/icons/splash/apple-splash-414-736-3-dark.png" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" />
		<link rel="apple-touch-startup-image" href="/icons/splash/apple-splash-414-896-2.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait) and (prefers-color-scheme: light)" />
		<link rel="apple-touch-startup-image" href="/icons/splash/apple-splash-414-896-2-dark.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait) and (prefers-color-scheme: dark)" />
		<link rel="apple-touch-startup-image" href="/icons/splash/apple-splash-414-896-3.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" />
		<link rel="apple-touch-startup-image" href="/icons/splash/apple-splash-414-896-3-dark.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" />
		<link rel="apple-touch-startup-image" href="/icons/splash/apple-splash-428-926-3.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" />
		<link rel="apple-touch-startup-image" href="/icons/splash/apple-splash-428-926-3-dark.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" />
		<link rel="apple-touch-startup-image" href="/icons/splash/apple-splash-430-932-3.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" />
		<link rel="apple-touch-startup-image" href="/icons/splash/apple-splash-430-932-3-dark.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" />
		<!-- Couleur de la barre du navigateur mobile, alignée sur --bg clair/sombre (app.css) —
		     sans ça elle reste au vert accent, y compris en thème sombre. -->
		<meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#131419" media="(prefers-color-scheme: dark)" />
		<meta name="color-scheme" content="light dark" />
		<meta name="robots" content="noindex, nofollow" />
		<meta
			name="description"
			content="Suivi de chiffrage & d'imputation : tickets, feuille de temps et reporting au même endroit."
		/>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Imputo" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />

		<!-- Anti-flash : applique thème + accent AVANT le 1er rendu (depuis le localStorage). -->
		<script>
			(function () {
				try {
					var t = localStorage.getItem('imputo-theme') || 'system';
					var dark =
						t === 'dark' ||
						(t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
					var a = localStorage.getItem('imputo-accent');
					if (a) document.documentElement.style.setProperty('--accent', a);
				} catch (e) {}
			})();
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />

		<!-- Polices : <link> plutôt que @import dans app.css — le navigateur les découvre dès le
		     parsing du HTML au lieu d'attendre le CSS, donc moins de flash de police par défaut. -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
		/>

		<!-- Identité / favicon -->
		<!-- L'icône SVG est déclarée par le layout racine (svelte:head), pas ici : son href change
		     avec la couleur d'accent pour forcer le navigateur à la re-fetcher (voir +layout.svelte). -->
		<link rel="alternate icon" type="image/png" href="/icons/favicon-32.png" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

		<!-- PWA -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<!-- Couleur de la barre du navigateur mobile, alignée sur --bg clair/sombre (app.css) —
		     sans ça elle reste au vert accent, y compris en thème sombre. -->
		<meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#131419" media="(prefers-color-scheme: dark)" />
		<meta name="color-scheme" content="light dark" />
		<meta
			name="description"
			content="Suivi de chiffrage & d'imputation : tickets, feuille de temps et reporting au même endroit."
		/>
		<meta name="google-site-verification" content="UoTG35Qh1OilyyUm2wo-LuvpEZpCRjlBeAQOE5aMGgY" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Imputo" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />

		<!-- Anti-flash : applique thème + accent AVANT le 1er rendu (depuis le localStorage). -->
		<script>
			(function () {
				try {
					var t = localStorage.getItem('imputo-theme') || 'system';
					var dark =
						t === 'dark' ||
						(t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
					var a = localStorage.getItem('imputo-accent');
					if (a) document.documentElement.style.setProperty('--accent', a);
				} catch (e) {}
			})();
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
